<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaStore - Contato</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <h1>MangaStore</h1>
        <p>Entre em contato conosco!</p>
    </header>
    <nav>
        <a href="../index.php">Início</a>
        <a href="mangas.html">Mangás</a>
        <a href="contato.html">Contato</a>
        <button id="theme-toggle" class="theme-toggle-btn">Modo Escuro</button>
    </nav>
    <main>
        <section class="contato">
            <h2>Entre em Contato</h2>
            <p>Tem alguma dúvida sobre nossos mangás? Entre em contato com a MangaStore!</p>
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" rows="5" placeholder="Digite sua mensagem"></textarea>

                <button type="submit">Enviar mensagem</button>
            </form>
        </section>
    </main>
    <script src="../JS/script.js"></script>
</body>
</html>
